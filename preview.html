 $('#logout').onclick=run(async()=>{await nativeCall('logout');toast('已清除学校登录会话');});
 $('#sync-settings-form').onsubmit=run(async e=>{const f=new FormData(e.target),enabled=f.has('enabled'),intervalMinutes=Number(f.get('intervalMinutes'));if(!Number.isInteger(intervalMinutes)||intervalMinutes<1||intervalMinutes>10080)throw Error('间隔应为 1–10080 分钟的整数');state.syncPreferences=demo?{enabled,intervalMinutes}:await nativeCall('saveSyncPreferences',{enabled,intervalMinutes});syncMessage=enabled?'启动自动同步已开启 · 最短间隔 '+intervalMinutes+' 分钟':'启动自动同步已关闭';updateSyncDom();toast('同步设置已保存');});
 $('#settings-form').onsubmit=run(async e=>{const f=new FormData(e.target),termName=String(f.get('termName')).trim(),firstMonday=String(f.get('firstMonday')),termConfirmed=f.has('termConfirmed'),timesConfirmed=f.has('timesConfirmed'),weekCount=Number(f.get('weekCount'));if(!termName)throw Error('请填写学期名称');if(firstMonday&&(!A.dateISO(firstMonday)||new Date(firstMonday+'T00:00:00Z').getUTCDay()!==1))throw Error('第一教学周日期必须是周一');if(termConfirmed&&!firstMonday)throw Error('请先选择校历日期');if(!Number.isInteger(weekCount)||weekCount<1||weekCount>40)throw Error('周数应在 1–40 之间');const lines=String(f.get('periods')).split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length>16)throw Error('最多可填写 16 节课');const periods=lines.map(x=>{const m=x.match(/^(\d{1,2}:\d{2})\s*[-–—~～]\s*(\d{1,2}:\d{2})$/),p=m&&A.timeRange(x);if(!p)throw Error('作息格式应为 08:00-08:45，且结束晚于开始');return{start:p[0],end:p[1]};});for(let i=1;i<periods.length;i++)if(periods[i].start<periods[i-1].end)throw Error('相邻课节时间有重叠或顺序错误');if(timesConfirmed&&!periods.length)throw Error('请先填写上课时间');await persist('settings',{termName,firstMonday,weekCount,termConfirmed,timesConfirmed,periods});week=A.currentWeek(state.settings,today());render();toast('学期与作息已保存');});
 $('#new-memo').onclick=()=>editMemo();$$('[data-memo-toggle]').forEach(b=>b.onclick=run(async()=>{await persist('memos',state.memos.map(m=>m.id===b.dataset.memoToggle?{...m,done:!m.done}:m));renderUser();}));$$('[data-memo-edit]').forEach(b=>b.onclick=()=>editMemo(state.memos.find(m=>m.id===b.dataset.memoEdit)));
 $('#manage-query-cache').onclick=()=>openCacheCleanup('courses');$('#manage-alarms').onclick=run(showAlarms);$('#demo-toggle').onclick=run(async()=>{if(demo){if(isNative){demo=false;await loadNative();}else{toast('网页为独立预览；真实功能需要安装安卓应用');}}else enterDemo();});
 $('#clear-data').onclick=()=>ask('清空本机数据','将删除保存的账号、密码、课表、考试、成绩、备忘录、新闻连接与缓存和本应用闹钟，并退出学校会话。系统日历中已保存的事项需在日历中删除。',async()=>{state=normalize(await nativeCall('clear'));window.NewsUI?.reset();render();toast('本机数据已清空');});
 updateSyncDom();
}
function renderMemos(){return state.memos.length?state.memos.slice().sort((a,b)=>Number(a.done)-Number(b.done)||b.at-a.at).map(m=>`<div class="note ${m.done?'done':''}"><button class="note-toggle" data-memo-toggle="${esc(m.id)}" aria-label="${m.done?'标记未完成':'标记完成'}">${m.done?'☑':'□'}</button><div class="note-body">${esc(m.text)}<small class="note-meta">${new Date(m.at).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'})}</small></div><button class="note-menu" data-memo-edit="${esc(m.id)}" aria-label="编辑备忘录">•••</button></div>`).join(''):'<div class="empty"><p>这里还很安静。<br>记下一件待办，或一个突然想到的念头。</p></div>';}
function editMemo(m){modal(m?'编辑备忘录':'新建备忘录',`<form id="memo-form"><div class="field"><label for="memo-text">内容</label><textarea id="memo-text" name="text" rows="6" maxlength="3000" placeholder="写下你的想法…" required>${esc(m?.text||'')}</textarea></div><div class="actions"><button class="btn" type="submit">保存</button>${m?'<button class="btn danger" id="delete-memo" type="button">删除</button>':''}</div></form>`);$('#memo-form').onsubmit=run(async e=>{const text=String(new FormData(e.target).get('text')).trim();if(!text)throw Error('先写一点内容');if(!m&&state.memos.length>=300)throw Error('最多保存 300 条备忘录');await persist('memos',m?state.memos.map(x=>x.id===m.id?{...m,text}:x):[{id:id(),text,done:false,at:Date.now()},...state.memos]);closeModal();renderUser();});$('#delete-memo')?.addEventListener('click',()=>ask('删除备忘录','删除此条备忘录？',async()=>{await persist('memos',state.memos.filter(x=>x.id!==m.id));renderUser();}));}
function openCacheCleanup(initial='courses'){
 modal('清理查询缓存',`<form id="cache-cleanup-form"><div class="field"><label for="cache-kind">查询类型</label><select id="cache-kind" name="kind"><option value="courses" ${initial==='courses'?'selected':''}>课表</option><option value="exams" ${initial==='exams'?'selected':''}>考试</option></select></div><div class="field"><label for="cache-scope">学期范围</label><select id="cache-scope" name="scope"><option value="current">当前学期：${esc(state.settings.termName)}</option><option value="all">全部已缓存学期</option></select></div><p class="tiny muted" id="cache-count"></p><div class="notice">会删除所选范围内的查询记录，包括手动修正。账号、成绩、备忘录和新闻保留。已设置的闹钟及日历日程继续有效，需要时请另行取消。</div><p class="tiny muted">删除不会立即查询学校；以后手动同步或满足启动自动同步条件时，可重新获取。</p><div class="actions"><button class="btn" type="submit">继续</button><button class="btn secondary" type="button" id="cache-cancel">取消</button></div></form>`);
 const form=$('#cache-cleanup-form'),update=()=>{const kind=$('#cache-kind').value,all=$('#cache-scope').value==='all',n=(state[kind]||[]).filter(x=>all||x.term===state.settings.termName).length;$('#cache-count').textContent='将清除 '+n+' 条'+(kind==='courses'?'课表':'考试')+'记录及对应缓存信息。';};form.onchange=update;update();$('#cache-cancel').onclick=closeModal;
 form.onsubmit=run(event=>{const formData=new FormData(event.target),kind=String(formData.get('kind')),scope=String(formData.get('scope')),term=state.settings.termName;const count=(state[kind]||[]).filter(x=>scope==='all'||x.term===term).length;ask('确认清除'+(kind==='courses'?'课表':'考试')+'缓存','范围：'+(scope==='all'?'全部学期':term)+'，共 '+count+' 条。缓存无法直接撤销，后续可以重新同步获取；已设置的提醒保留。',()=>clearQueryCache({kind,scope,term}));});
}
async function clearQueryCache(options){
 syncGeneration++;stopAcademicProgress();
 if(demo){const {kind,scope,term}=options,all=scope==='all';state[kind]=(state[kind]||[]).filter(x=>!all&&x.term!==term);for(const key of Object.keys(state.importMeta))if(all?key.startsWith(kind+'|'):key===kind+'|'+term)delete state.importMeta[key];if(kind==='courses')for(const key of Object.keys(state.colors))if(all||key.startsWith(term+'|'))delete state.colors[key];syncMessage='已清除所选示例缓存';}
 else{state=normalize(await nativeCall('clearQueryCache',options));syncMessage=state.syncReport?.message||'已清除所选查询缓存';}
 if(demo||!state.pendingImport)importing=null;closeModal();render();toast(demo?'已清除示例缓存':syncMessage);
}

async function showAlarms(){if(demo){modal('已设置的闹钟','<div class="empty"><h3>示例模式不创建系统闹钟</h3><p>真实使用时，课程与考试详情中的闹钟会显示在这里。</p></div>');return;}const alarms=await nativeCall('alarms');modal('已设置的闹钟',`<p class="tiny muted">这里只管理汐序设置的闹钟，不读取其他应用提醒。</p><div class="mini-list">${alarms.length?alarms.map(a=>`<button data-cancel-alarm="${a.id}"><span><b>${esc(a.name)}</b><br>${esc(a.date)} ${esc(a.start)} · 提前 ${a.advance||0} 分钟<br>${a.at<Date.now()?'已过提醒时间':'等待提醒'}</span><span>取消 ×</span></button>`).join(''):'<div class="empty"><p>尚未设置闹钟</p></div>'}</div>`);$$('[data-cancel-alarm]').forEach(b=>b.onclick=run(async()=>{await nativeCall('cancelAlarm',{id:+b.dataset.cancelAlarm});await showAlarms();}));}
function openImport(){const p=importing;if(!p)return;const kind=p.kind,canReplace=!p.snapshot.truncated;modal('核对并导入'+titles[kind],`<p class="tiny muted">来源：${esc(p.host)} · 只读取你当前打开的页面。请确认教务页面所选学期和条目内容。</p>${p.warnings.map(w=>`<div class="notice warn">${esc(w)}</div>`).join('')}${!p.records.length?'<div class="notice warn">未识别到支持的表头或课表。现有数据保持不变；请提供去掉个人信息的查询页截图，以便补充适配。</div>':''}<div class="field"><label>此页数据所属学期</label><input id="import-term" value="${esc(state.settings.termName)}" maxlength="60"></div><div class="import-list">${p.records.map((r,i)=>`<button class="import-row" data-import-edit="${i}"><span>${esc(r.name)}<br><span class="muted tiny">${kind==='courses'?`周 ${r.day||'?'} · ${r.startPeriod||'?'}–${r.endPeriod||'?'} 节 · ${r.weeks?.length||0} 个教学周`:kind==='exams'?esc((r.date||'日期待补全')+' '+(r.start||'')+' '+(r.room||'')):esc('成绩 '+r.score+' / 绩点 '+(r.point??'—'))}</span></span><span class="pill">${kind==='grades'?'成绩':A.complete(r,kind)?'可编辑':'待补全'}</span></button>`).join('')}</div><label class="check-row"><input type="checkbox" id="import-checked"><span>我已核对学期与页面内容。未识别完整的时间会保留为待补全，不用于提醒。</span></label><div class="field"><label>保存方式</label><select id="import-mode"><option value="merge">合并当前页（保留已导入的其他条目）</option><option value="replace" ${canReplace?'':'disabled'}>替换此学期该类数据（完整课表更新时使用）</option></select></div><p class="tiny muted">替换会删除此学期此前导入的同类数据；分页结果应逐页合并。若只需更新一条，请在详情页编辑。</p><div class="actions"><button class="btn" id="confirm-import" ${p.records.length?'':'disabled'}>保存 ${p.records.length} 条</button><button class="btn secondary" id="discard-import">放弃本次读取</button></div>`);
 $$('[data-import-edit]').forEach(b=>b.onclick=()=>{const index=+b.dataset.importEdit;if(kind==='grades'){toast('成绩按原表读取；若内容不符请放弃此次导入');return;}editRecord(p.records[index],kind,async next=>{p.records[index]={...next,manualOverride:true};openImport();},openImport);});
 $('#discard-import').onclick=run(async()=>{await nativeCall('consumeImport');importing=null;closeModal();});
 $('#confirm-import').onclick=run(async()=>{const term=$('#import-term').value.trim(),mode=$('#import-mode').value;if(!term)throw Error('请填写此页实际所属学期');if(!$('#import-checked').checked)throw Error('请先核对学期与内容并勾选确认');
 const syncInfo=await nativeCall('inspectSyncTarget',{kind,term});const imported=p.records.map(r=>({...r,id:id(),term,...(syncInfo.enabled?{syncSourceKey:syncInfo.sourceKey}:{})}));let data=mode==='replace'?state[kind].filter(x=>x.term!==term):[...state[kind]];const keys=new Map(data.map((x,i)=>[x.term+'|'+A.key(x),i]));for(const r of imported){const k=r.term+'|'+A.key(r);if(!keys.has(k)){keys.set(k,data.length);data.push(r);}else if(syncInfo.enabled){const i=keys.get(k);data[i]={...data[i],syncSourceKey:syncInfo.sourceKey};}}
 if(data.length>2500)throw Error('条目数超过本机上限，请先清理旧数据');
 state=normalize(await nativeCall('commitImport',{kind,term,data,settings:state.settings,capturedAt:p.capturedAt,meta:{at:p.capturedAt,host:p.host,partial:p.snapshot.possiblePagination||p.snapshot.truncated||p.snapshot.blockedFrames>0,officialGpa:p.officialGpa||''}}));syncMessage=syncInfo.enabled?'已保存查询页，下次启动自动同步':'已导入；自动同步暂不可用：'+syncInfo.reason;
 importing=null;closeModal();sub=kind;tab='query';render();toast(term===state.settings.termName?'导入完成，现可离线查看':'已保存到 '+term+'；可在用户页切换学期名称查看');});
}
let lastWide=matchMedia('(min-width:720px)').matches;window.addEventListener('resize',()=>{const w=matchMedia('(min-width:720px)').matches;if(lastWide!==w){lastWide=w;if(tab==='query')renderQuery();}});
if(isNative)loadNative().then(runStartup).catch(e=>{render();toast('本地资料暂时无法读取：'+e.message);});else enterDemo();
</script></body></html>
